<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCzone Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">PC</span><span>PCzone Admin</span></a><div class="actions"><a class="btn ghost" href="index.html">المتجر</a><button id="logout" class="btn primary">خروج</button></div></header><main class="section"><div id="guard" class="card" style="padding:25px">جارٍ التحقق...</div><div id="panel" class="hidden"><div class="section-head"><div><span class="eyebrow">CONTROL CENTER</span><h2>لوحة التحكم</h2></div></div><div class="stats" style="margin-bottom:30px"><div><b id="countP">0</b><span>المنتجات</span></div><div><b id="countO">0</b><span>الطلبات</span></div><div><b id="countU">0</b><span>المستخدمون</span></div></div><div class="card" style="padding:24px;margin-bottom:18px"><h3>إضافة / تعديل منتج</h3><input type="hidden" id="pid"><div class="field"><label>الاسم</label><input id="pname"></div><div class="field"><label>الوصف</label><textarea id="pdesc"></textarea></div><div class="field"><label>السعر بالدولار</label><input id="pprice" type="number" step="0.01"></div><div class="field"><label>التصنيف</label><input id="pcat"></div><div class="field"><label>رابط الصورة</label><input id="pimg"></div><div class="dialog-actions"><button class="btn primary" onclick="saveProduct()">حفظ المنتج</button><button class="btn ghost" onclick="resetProduct()">تفريغ</button></div></div><div class="card" style="padding:24px;margin-bottom:18px"><h3>منشور / عرض</h3><div class="field"><label>العنوان</label><input id="posttitle"></div><div class="field"><label>المحتوى</label><textarea id="postcontent"></textarea></div><button class="btn primary" onclick="savePost()">نشر</button></div><div class="card" style="padding:24px"><h3>المنتجات</h3><div id="adminProducts"></div></div></div></main><script src="config.js"></script><script src="admin.js"></script></body></html>
